<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Quotes Search{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23a3402e'/%3E%3Ctext x='16' y='27' font-family='Georgia,serif' font-size='30' text-anchor='middle' fill='%23fff'%3E%E2%80%9C%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  <footer class="site-footer">
    {% if stats %}
      <span>{{ "{:,}".format(stats.pages) }} pages</span>
      <span>{{ "{:,}".format(stats.terms) }} terms</span>
      {% if stats.built_at %}<span>indexed {{ stats.built_at[:10] }}</span>{% endif %}
    {% endif %}
    <span>Data from <a href="https://quotes.toscrape.com/" rel="noopener">quotes.toscrape.com</a></span>
    <span><a href="{{ url_for('api_stats') }}">JSON API</a></span>
    <span class="site-footer__credit">Built by Hamza Ahmed · <a href="https://github.com/HAMZl" rel="noopener">GitHub @HAMZl</a></span>
  </footer>
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</body>
</html>
